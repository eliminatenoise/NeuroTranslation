<main>
<h1>Treadmill load from muscle readings</h1>
<p id="cohort"></p>
<p>The model sees the earlier muscle readings. Each forecast estimates the load on two treadmill plates over the next tenth of a second. Lower error means a closer forecast.</p>
<label for="scope">Recordings to compare</label>
<select id="scope">
  <option value="primary">Main comparison</option>
  <option value="sensitivity">All four people with paired readings</option>
</select>
<label for="metric">Error to display</label>
<select id="metric">
  <option value="mean_force">Average across the two plates (N·s)</option>
  <option value="first">Plate 1 (N·s)</option>
  <option value="second">Plate 2 (N·s)</option>
  <option value="combined">The two plate readings added together (N·s)</option>
  <option value="probability">Load probability</option>
  <option value="loaded">Windows with load (N·s)</option>
  <option value="unloaded">Windows without load (N·s)</option>
</select>
<p id="explain" aria-live="polite"></p>
<div class="list">
<table>

<script>
const report = JSON.parse(document.getElementById('data').textContent);
const scope = document.getElementById('scope');
const selection = document.getElementById('metric');
const rows = document.getElementById('results');
const views = {
  mean_force: ['average_plate_mae_ns', 'The two plate errors are given equal weight. Load over time is measured here in newton-seconds.'],
  first: ['impulse_mae_per_plate_ns', 'The first plate in the recording file.', 0],
  second: ['impulse_mae_per_plate_ns', 'The second plate in the recording file.', 1],
  combined: ['combined_impulse_mae_ns', 'The two plate loads are added before scoring. Some errors cancel when added.'],
  probability: ['average_plate_event_brier', 'The score averages the squared differences between predicted chances and whether the load exceeded 1 N·s.'],
  loaded: ['mean_absolute_error_loaded_ns', 'Each plate is scored on windows with measured load above 1 N·s.'],
  unloaded: ['mean_absolute_error_unloaded_ns', 'Each plate is scored on windows with measured load of 1 N·s or less.'],
};
function display() {
  const cohort = scope.value === 'primary' ? report : report.sensitivity;
  document.getElementById('cohort').textContent =
    `${cohort.scored_windows} forecasts from ${cohort.scored_people} people kept out of fitting for this decline task.`;
  for (const option of selection.options) {
    option.disabled = !Object.hasOwn(cohort.results[report.methods[0]], views[option.value][0]);
  }
  if (selection.selectedOptions[0].disabled) selection.value = 'mean_force';
  const [key, note, index] = views[selection.value];
  const values = report.methods.map(method => {
    const result = cohort.results[method][key];
    return index === undefined ? result : result[index];
  });
  const largest = Math.max(0.001, ...values);
  document.getElementById('explain').textContent = note;
  document.getElementById('selected-metric').textContent = selection.selectedOptions[0].textContent;
  rows.replaceChildren();
  for (const [i, method] of report.methods.entries()) {
    const row = document.createElement('tr');
    const title = document.createElement('th'); title.scope = 'row'; title.textContent = report.labels[method];
    const number = document.createElement('td'); number.className = 'number'; number.textContent = values[i].toFixed(3);
    const chart = document.createElement('td'); chart.className = 'relative'; chart.setAttribute('aria-hidden', 'true');
    const bar = document.createElement('span'); bar.className = 'bar'; bar.style.width = (100*values[i]/largest) + '%';
    chart.append(bar);
    row.append(title, number, chart); rows.append(row);
  }
}
selection.addEventListener('change', display);
scope.addEventListener('change', display);
display();
</script>
