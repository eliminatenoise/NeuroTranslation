  <style>

    label[hidden] { display: none; }

             color: inherit; font: inherit; font-weight: 500; border: 1px solid #8ba2ae; border-radius: .45rem; background: white; }
    :focus-visible { outline: 3px solid #19788e; outline-offset: 3px; }
    #coverage { color: #445867; font-size: .94rem; margin: 1.2rem 0 .4rem; }

    table { width: 100%; min-width: 480px; border-collapse: collapse; font-size: .92rem; }

</head>
<body>
  <main>
    <h1>Decline treadmill forecasts</h1>
    <p>Each forecast estimates how much force the treadmill plates will register over the next tenth of a second. A smaller error is better.</p>
    <nav aria-label="Study reports">
      <a href="README.md">Simple edition</a>
      <a href="TECHNICAL.md">Technical edition</a>
    </nav>
    <div class="filters">
      <label for="study">Recording group
        <select id="study">
          <option value="transfer">10° decline · new walkers</option>
          <option value="movement">5° decline · movement sensor study</option>
          <option value="earlier">5° decline · earlier three-person test</option>
          <option value="sensitivity">5° decline · earlier four-person check</option>
        </select>
      </label>
      <label id="conditions" for="condition">10° comparison
        <select id="condition">
          <option value="supplied_mass">Muscle, body mass and slope</option>
          <option value="muscle_only">Muscle alone</option>
        </select>
      </label>
      <label id="earlier-measures" for="metric" hidden>Earlier error measure
        <select id="metric">
          <option value="average">Mean plate error (N·s)</option>
          <option value="plate_1">Plate 1 error (N·s)</option>
          <option value="plate_2">Plate 2 error (N·s)</option>
          <option value="total">Total impulse error (N·s)</option>
          <option value="probability">Squared load probability error</option>
          <option value="loaded">Error in windows with load (N·s)</option>
          <option value="unloaded">Error in windows without load (N·s)</option>
        </select>
      </label>
    </div>
    <p id="coverage" aria-live="polite"></p>
    <p id="finding"></p>
    <div class="table-wrap" role="region" aria-label="Forecast comparison" tabindex="0">
      <table aria-describedby="scope">
        <thead id="columns"></thead>
        <tbody id="results"></tbody>
      </table>
    </div>
    <p id="scope"></p>
  </main>
  <noscript><p>Read the Simple or Technical edition for the results without JavaScript.</p></noscript>

  <script>
    const report = JSON.parse(document.getElementById('report').textContent);
    const nodes = Object.fromEntries(['study', 'condition', 'conditions', 'metric', 'earlier-measures',
      'coverage', 'finding', 'columns', 'results', 'scope']
      .map(id => [id, document.getElementById(id)]));

    function displayed(value, places = 3) {
      return value == null ? '—' : value.toFixed(places);
    }

    function cell(tag, content, scope = '') {
      const item = document.createElement(tag);
      item.textContent = content;
      if (scope) item.scope = scope;
      return item;
    }

    function table(headings, rows) {
      const header = document.createElement('tr');
      header.append(...headings.map(heading => cell('th', heading, 'col')));
      nodes.columns.replaceChildren(header);
      nodes.results.replaceChildren(...rows.map(([title, ...values]) => {
        const row = document.createElement('tr');
        row.append(cell('th', title, 'row'), ...values.map(value => cell('td', value)));
        return row;
      }));
    }

    function transfer() {
      const condition = nodes.condition.value;
      const known = condition === 'supplied_mass';
      const results = [...report.transfer.conditions[condition]].sort((a, b) => a.total_mae_ns - b.total_mae_ns);
      const { total, separate_plates: plates } = report.transfer.evaluation;
      nodes.coverage.textContent = `${total.windows} forecasts from ${total.people} people for total load. ${plates.windows} forecasts from ${plates.people} people for the separate plates.`;
      nodes.finding.textContent = known
        ? 'Nine compact passes had the lowest total error. Seven passes were close.'
        : 'The linear fit had the lowest total error and beat the fixed reference for two of four people.';
      nodes.scope.textContent = 'The 10° forecasts were fixed before scoring. Models were fitted on a 5° decline. The two-plate total adds signed force from both plates before measuring error. A dash means the fixed rule provides only a total. The plate labels follow the recording order.';
      table(['Forecast', 'Total (N·s)', 'Plate 1 (N·s)', 'Plate 2 (N·s)', 'People with lower total error'],
        results.map(row => [row.label, displayed(row.total_mae_ns), displayed(row.plate_mae_ns?.[0]),
          displayed(row.plate_mae_ns?.[1]), row.id.startsWith('fixed') || row.id.startsWith('static')
            ? 'Reference' : `${row.people_better_than_reference} of 4`]));
    }

    function movement() {
      const results = [...report.movement.methods].sort((a, b) => a.total_mae_ns - b.total_mae_ns);
      nodes.coverage.textContent = '1,060 forecasts from six people. Each person was evaluated using a fit from the other five.';
      nodes.finding.textContent = 'The camera-tracked pelvis forecast had the lowest error in this development study.';
      nodes.scope.textContent = 'All methods received body mass and slope. The camera and wearable readings come from the earlier 5° archive. The camera landmarks estimate pelvis movement. The timing of the physical devices and live performance remain unverified.';
      table(['Forecast', 'Total (N·s)'], results.map(row => [row.label, displayed(row.total_mae_ns)]));
    }

    function earlier(useAll) {
      const result = report.earlier[useAll ? 'sensitivity' : 'primary'];
      for (const option of nodes.metric.options) {
        option.disabled = result.rows.some(row => row.metrics[option.value] == null);
      }
      if (nodes.metric.selectedOptions[0].disabled) nodes.metric.value = 'average';
      const key = nodes.metric.value;
      const rows = [...result.rows].sort((a, b) => a.metrics[key] - b.metrics[key]);
      nodes.coverage.textContent = `${result.windows} forecasts from ${result.people} people.`;
      nodes.finding.textContent = useAll
        ? 'With all four people, one second of history and five compact passes gave the lowest mean plate error.'
        : 'With three people, 200 milliseconds of history and three compact passes gave the lowest mean plate error.';
      const notes = {
        average: 'This score gives both plates equal weight.',
        plate_1: 'This is the first plate in the recording file.',
        plate_2: 'This is the second plate in the recording file.',
        total: 'The two plate loads are added before scoring.',
        probability: 'The probability score is the average squared error for whether the plate registered more than 1 N·s.',
        loaded: 'Each plate is scored on windows with measured impulse over 1 N·s.',
        unloaded: 'Each plate is scored on windows with measured impulse of 1 N·s or less.',
      };
      nodes.scope.textContent = notes[key] + ' The earlier 5° test used a different muscle input recipe. The fourth person had no window with plate 1 at or below 1 N·s.';
      table(['Forecast', nodes.metric.selectedOptions[0].textContent],
        rows.map(row => [row.label, displayed(row.metrics[key], key === 'probability' ? 4 : 3)]));
    }

    function update() {
      nodes.conditions.hidden = nodes.study.value !== 'transfer';
      nodes['earlier-measures'].hidden = !['earlier', 'sensitivity'].includes(nodes.study.value);
      if (nodes.study.value === 'transfer') transfer();
      else if (nodes.study.value === 'movement') movement();
      else earlier(nodes.study.value === 'sensitivity');
    }

    nodes.study.addEventListener('change', update);
    nodes.condition.addEventListener('change', update);
    nodes.metric.addEventListener('change', update);
    update();
  </script>
</body>
