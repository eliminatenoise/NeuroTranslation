<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 304" role="img" aria-label="Absolute error on held-out walkers" font-family="Arial, sans-serif"><title>Absolute error on held-out walkers</title><desc>All values are person-balanced mean absolute errors in newtons. Smaller is closer to the recorded plate load.</desc><rect width="670" height="304" fill="#fff"/><text x="2" y="22" fill="#283d32" font-size="18" font-weight="700">Absolute error on held-out walkers</text><text x="2" y="43" fill="#53675a" font-size="13">Person-balanced mean absolute error (N). 8 people, 17 walks, 1,297 predictions.</text><text x="2" y="86" fill="#283d32" font-size="13">Transformer · movement and muscle</text><rect x="2" y="92" width="611" height="7" rx="3" fill="#eaf0e9"/><rect x="2" y="92" width="156.02742650970364" height="7" rx="3" fill="#ae4324"/><text x="669" y="99" fill="#283d32" font-size="12" text-anchor="end">70.2 N</text><text x="2" y="126" fill="#283d32" font-size="13">Transformer · movement only</text><rect x="2" y="132" width="611" height="7" rx="3" fill="#eaf0e9"/><rect x="2" y="132" width="144.89562178909202" height="7" rx="3" fill="#748b79"/><text x="669" y="139" fill="#283d32" font-size="12" text-anchor="end">65.2 N</text><text x="2" y="166" fill="#283d32" font-size="13">Nonlinear ridge · movement only</text><rect x="2" y="172" width="611" height="7" rx="3" fill="#eaf0e9"/><rect x="2" y="172" width="202.83099080268974" height="7" rx="3" fill="#748b79"/><text x="669" y="179" fill="#283d32" font-size="12" text-anchor="end">91.3 N</text><text x="2" y="206" fill="#283d32" font-size="13">Linear ridge · movement and muscle</text><rect x="2" y="212" width="611" height="7" rx="3" fill="#eaf0e9"/><rect x="2" y="212" width="611" height="7" rx="3" fill="#748b79"/><text x="669" y="219" fill="#283d32" font-size="12" text-anchor="end">274.9 N</text><text x="2" y="246" fill="#283d32" font-size="13">Earlier plate reading</text><rect x="2" y="252" width="611" height="7" rx="3" fill="#eaf0e9"/><rect x="2" y="252" width="140.9917386272088" height="7" rx="3" fill="#226696"/><text x="669" y="259" fill="#283d32" font-size="12" text-anchor="end">63.4 N</text><text x="2" y="290" fill="#53675a" font-size="11">Data: Moissenet &amp; Schreiber (2020), figshare v8, CC BY 4.0. Analysis: NeuroTranslation.</text><metadata>Source data: Florent Moissenet and Céline Schreiber, figshare v8 (2020), doi:10.6084/m9.figshare.7734767.v8, CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/). NeuroTranslation derived the models and results. Invented inputs are CC0.</metadata></svg>
