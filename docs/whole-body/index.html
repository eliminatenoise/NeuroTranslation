<style>
.activity-map { box-sizing:border-box; width:min(45rem,calc(100vw - 1.25rem)); max-height:90dvh; overflow:auto; overscroll-behavior:contain; padding:clamp(.85rem,3vw,1.7rem); color:#e5edf4; background:#101922; border:1px solid #708494; border-radius:.8rem; font:1rem/1.45 system-ui,sans-serif; color-scheme:dark }
.activity-map::backdrop { background:#071016b8 }
.activity-map [hidden] { display:none!important }
body:has(.activity-map[open]) #ns-shell-root { visibility:hidden }
.activity-head,.activity-switch,.activity-choices,.activity-transport { display:flex; align-items:center; flex-wrap:wrap; gap:.7rem }
.activity-head { justify-content:space-between }
.activity-head h1 { margin:0; font-size:1.3rem }
.activity-switch { margin:1rem 0 1.25rem; gap:.3rem }
.activity-map h2 { font-size:clamp(1.3rem,4vw,1.85rem); line-height:1.15; margin:.45rem 0 }
.activity-map p { margin:.65rem 0 }
.activity-map .activity-kicker { color:#9bd4c7; font-size:.71rem; font-weight:700; letter-spacing:.11em }
.activity-map button,.activity-map select { font:inherit; font-size:.9rem; color:inherit; background:#192938; border:1px solid #607789; border-radius:.35rem; padding:.38rem .6rem; cursor:pointer }
.activity-switch [aria-pressed=true],.activity-map [data-play],.activity-map [data-move] { background:#bce9dd; color:#132c25; border-color:#bce9dd }
.activity-map :focus-visible { outline:3px solid #f1d66b; outline-offset:2px }
.activity-map [data-replay] { margin-top:1rem }
.activity-transport { position:sticky; top:0; z-index:1; padding:.4rem 0; background:#101922 }
.activity-map :is(select,summary) { scroll-margin-top:4rem }
.activity-transport label { flex:1; display:flex; flex-direction:column; color:#bbcad6; font-size:.78rem; min-width:8rem }
.activity-transport input { accent-color:#abdecf; width:100%; margin:0; min-height:1.6rem }
.activity-transport output, .activity-trace output,.activity-map td { font-variant-numeric:tabular-nums }
.activity-traces { margin-top:.7rem }
.activity-trace { padding:.3rem .55rem; background:#0b141b; border-bottom:1px solid #2d3d49 }
.activity-trace-head,.activity-times { display:flex; justify-content:space-between; gap:.5rem; align-items:center; font-size:.81rem }
.activity-trace-head small { color:#b8c6d2; font-size:.73rem; margin-left:.5rem }
.activity-trace svg { width:100%; height:2.4rem; display:block; overflow:visible }
.activity-trace svg line,.activity-trace path { vector-effect:non-scaling-stroke; fill:none }
.activity-cursor { stroke:#fff; stroke-width:1.5 }
.activity-times,.activity-map .activity-note { color:#c1ccd6; font-size:.83rem }
.activity-map details { margin:1rem 0 .2rem; border-top:1px solid #3c4e5d; padding-top:.7rem }
.activity-map summary { cursor:pointer; font-weight:650; color:#bde5ff }
.activity-map table { border-collapse:collapse; width:100%; margin:.75rem 0; font-size:.87rem }
.activity-map th,.activity-map td { text-align:right; padding:.34rem; border-bottom:1px solid #3c4e5d }
.activity-map th:first-child,.activity-map caption { text-align:left }
.activity-map caption { padding:.25rem 0 }
.activity-map a { color:#bde5ff }
.activity-choices { align-items:flex-start; margin:.8rem 0 }
.activity-choices label { display:grid; gap:.2rem; font-size:.85rem; max-width:100% }
.activity-choices select { max-width:100% }
.activity-route { border-left:3px solid #efa568; padding:.3rem .8rem; margin:.65rem 0; background:#18232d }
.activity-route.sensory { border-color:#82c6ee }
.activity-route p { margin:.2rem 0 }
.activity-status:empty { display:none }
.activity-anatomy { margin:1rem 0; padding:.65rem .8rem; border:1px solid #3c4e5d; border-radius:.45rem }
.activity-nodes { display:grid; grid-template-columns:1fr auto 1fr auto 1fr; align-items:center; gap:.25rem; margin:.25rem 0 }
.activity-nodes > span { background:#1b2b36; padding:.4rem; text-align:center; border-radius:.25rem }
.activity-nodes strong,.activity-nodes small { display:block; font-size:.82rem }
.activity-nodes small,.activity-anatomy p { font-size:.73rem; color:#c1ccd6 }
.activity-nodes i { font-style:normal; color:#aebdc7 }
.activity-direction { text-align:right; font-size:.75rem; color:#f6b985; font-weight:650 }
.activity-direction.sensory { text-align:left; color:#92cfff }
.activity-anatomy p { margin:.5rem 0 0 }
.activity-instruments { display:grid; grid-template-columns:1.2fr 1fr; gap:.65rem; margin:.8rem 0 }
.activity-instrument { min-width:0; margin:0; padding:.6rem; border:1px solid #425966; border-radius:.45rem; background:#101c26 }
.activity-instrument figcaption,.activity-forearm-title { font-size:1rem; font-weight:650; margin:0 }
.activity-instrument figcaption small,.activity-forearm-title small { display:block; font-size:.76rem; font-weight:400; color:#bed0dc }
.activity-instrument svg { display:block; width:100%; height:auto; max-height:14rem; margin:.35rem auto; text-anchor:middle; font-family:system-ui,sans-serif }
.activity-instrument .diagram-direction { fill:#cad9df; font-size:10px }
.activity-instrument .site-name { fill:#e9f0f5; font-size:12px; font-weight:650 }
.activity-instrument .site-voltage { fill:#f6f8fa; font-size:12px; font-variant-numeric:tabular-nums }
.activity-colour-key { display:flex; flex-wrap:wrap; justify-content:space-between; font-size:.73rem; margin:0 .8rem; color:#d7e2e8 }
.activity-colour-key i { flex:0 0 100%; height:.48rem; border-radius:.2rem; background:linear-gradient(90deg,rgb(27,112,161),rgb(238,240,239),rgb(180,76,18)) }
.angle-pair { font-size:.79rem; text-align:center; font-variant-numeric:tabular-nums; color:#ffdd91 }
.activity-pairs { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.4rem; margin:.55rem 0 .85rem }
.activity-pairs > div { display:grid; grid-template-rows:auto 1fr auto; padding:.45rem; border-top:1px solid #506774; background:#14232d }
.activity-pairs small { color:#b9c9d5; font-size:.7rem }
.activity-pairs span { font-size:.78rem }
.activity-pairs output { color:#ffcf9f; font-size:1rem; font-weight:650; font-variant-numeric:tabular-nums }
.activity-trace-choices { display:flex; flex-wrap:wrap; gap:.65rem }
@media (max-width:570px) {
  .activity-instruments { grid-template-columns:1fr }
  .activity-pairs { grid-template-columns:repeat(2,minmax(0,1fr)) }
}
.spatial-select { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; margin:.65rem 0 }
.spatial-select select { max-width:100% }
.spatial-figure { margin:.55rem 0 0; border:1px solid #425966; border-radius:.45rem; overflow:hidden; background:#0a151e }
.spatial-figure canvas { width:100%; height:clamp(13rem,37vh,24rem); display:block; cursor:grab; touch-action:pan-y }
.spatial-figure canvas:active { cursor:grabbing }
.spatial-figure figcaption { display:flex; flex-wrap:wrap; gap:.35rem .9rem; align-items:center; padding:.35rem .7rem; background:#14232d; font-size:.77rem }
.spatial-key::before { content:""; display:inline-block; width:.6rem; height:.6rem; border-radius:50%; margin-right:.3rem; background:#e5e9ed }
.spatial-key.left::before { background:#70d8ff }
.spatial-key.right::before { background:#ffb36b }
.spatial-figure [data-motion-count] { margin-left:auto; color:#c5d0db }
.spatial-transport { display:flex; flex-wrap:wrap; align-items:center; gap:.7rem; margin:.55rem 0 }
.spatial-transport label { min-width:8rem; flex:1; display:flex; flex-direction:column; font-size:.78rem; color:#bbcad6 }
.spatial-transport input { width:100%; margin:0; min-height:1.6rem }
.spatial-panel [data-motion-status]:empty { display:none }
.activity-map [data-motion-play] { color:#132c25; background:#bce9dd; border-color:#bce9dd }
.spatial-options,.spatial-orbit { display:flex; align-items:center; gap:.3rem 1rem; flex-wrap:wrap; margin:.5rem 0 }
.spatial-options label,.spatial-orbit label { font-size:.87rem }
.spatial-orbit label { display:flex; flex:1 1 7rem; align-items:center; gap:.35rem }
.spatial-orbit input { width:5rem; min-width:1rem; flex:1 }
.spatial-panel input { accent-color:#abdecf }
.spatial-panel output { font-variant-numeric:tabular-nums }

html{color-scheme:dark;background:#101922}
body{margin:0;color:#e5edf4;font:1rem/1.5 system-ui,sans-serif}
main{margin:0 auto;padding:1.6rem clamp(.9rem,4vw,2rem) 3rem;max-width:52rem}
main.activity-map{width:auto;height:auto;max-height:none;overflow:visible;border:none;border-radius:0}
main h1{font-size:clamp(1.9rem,5.6vw,3.4rem);letter-spacing:-.04em;line-height:1.06;margin:.6rem 0 1.3rem}
main a{color:#9be3d1}
header a,footer{font-size:.87rem} footer{margin-top:1.6rem}
.spatial-panel select{max-width:100%}
</style>

<script type="module">// study-release/docs/whole-body/viewer/spatial-recording.mjs
var GUIDE_PATHS = [
  ["LFHD", "RFHD", "RBHD", "LBHD", "LFHD"],
  ["C7", "LSHO"],
  ["C7", "RSHO"],
  ["LSHO", "CLAV", "RSHO"],
  ["CLAV", "STRN"],
  ["C7", "T10"],
  ["LBHD", "C7", "RBHD"],
  ["STRN", "LFWT", "RFWT", "STRN"],
  ["T10", "LBWT", "RBWT", "T10"],
  ["LFWT", "LBWT"],
  ["RFWT", "RBWT"],
  ...["L", "R"].flatMap((side) => [
    ["SHO", "UPA", "ELB", "FRM", "WRA", "FIN", "WRB", "FRM"],
    ["FWT", "THI", "KNE", "SHN", "ANK", "HEE", "TOE", "MT5", "ANK"]
  ].map((path) => path.map((suffix) => side + suffix)))
];
var gameAssets = () => new URL("../../../assets/spatial-motion/", import.meta.url);
var DEFAULT_VIEW = { yaw: 28, pitch: 12 };
var SIDE_NAMES = {
  FHD: "front of head",
  BHD: "back of head",
  SHO: "shoulder",
  UPA: "upper arm",
  ELB: "elbow",
  FRM: "forearm",
  WRA: "wrist A",
  WRB: "wrist B",
  FIN: "hand",
  FWT: "front waist",
  BWT: "back waist",
  THI: "thigh",
  KNE: "knee",
  SHN: "shin",
  ANK: "ankle",
  HEE: "heel",
  TOE: "toe",
  MT5: "outer foot"
};
function markerName(label) {
  const side = label[0] === "R" ? "Right" : label[0] === "L" ? "Left" : "";
  const name = side && SIDE_NAMES[label.slice(1)];
  if (name) return side + " " + name + " \xB7 " + label;
  const middle = { NOSE: "Nose", C7: "Base of neck", T10: "Mid-back", STRN: "Breastbone", CLAV: "Collarbone area", RBAC: "Right back" };
  return middle[label] ? middle[label] + " \xB7 " + label : label;
}
async function readManifest(baseUrl = gameAssets(), fetchImpl = fetch) {
  const r = await fetchImpl(new URL("manifest.json", baseUrl));
  if (!r.ok) throw Error("Recording list unavailable.");
  const manifest = await r.json();
  const rows = manifest.clips;
  if (!Array.isArray(rows) || !rows.length || rows.some((row) => !/^\w+$/.test(row.id) || row.file !== row.id + ".json" || !row.label || !/^[a-f\d]{64}$/.test(row.sha256)) || new Set(rows.map((row) => row.id)).size !== rows.length) {
    throw Error("Invalid recording list.");
  }
  return manifest;
}
async function readMotion(entry, baseUrl = gameAssets(), fetchImpl = fetch) {
  const r = await fetchImpl(new URL(entry.file, baseUrl));
  if (!r.ok) throw Error("Recording unavailable.");
  const bytes = await r.arrayBuffer();
  const digest = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
